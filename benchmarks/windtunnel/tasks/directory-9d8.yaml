tasks:
  - id: directory-search
    tier: act-short
    prompt: Search the directory for a {params.kind} tool and report its name.
    params:
      kind: design
    # The oracle (capsules/directory-9d8/oracle.sh) has no search probe — score
    # the reported name. The seeded design-category listings are Figma and
    # Dribbble; neither name appears in the prompt.
    predicate:
      all:
        - type: answer
          contains_any: [figma, dribbble]
        - any:
            - type: worker_trace
              action: click
            - type: worker_trace
              action: fill
            - type: worker_trace
              action: mouse_click
            - type: worker_trace
              action: execute_native_tool
  - id: directory-filter
    tier: act-short
    prompt: Filter the directory to developer tools, then report one result shown in the filtered list.
    # The old prompt asked only for the action but scored an answer it never
    # requested, and the oracle has no probe for the browser's active filter —
    # a page probe would pass without the filter ever being applied. Asking for
    # a result makes the action observable in the answer. The seeded
    # Development category holds exactly GitHub and React (init-db.mjs);
    # neither name appears in the prompt.
    predicate:
      all:
        - type: answer
          matches: "\\b(github|react)\\b"
        - any:
            - type: worker_trace
              action: click
            - type: worker_trace
              action: mouse_click
            - type: worker_trace
              action: execute_native_tool
  - id: directory-detail
    tier: answer
    prompt: Open the Figma listing and report its one-line description.
    # No listing-detail probe in the oracle — score the reported description.
    # The seed describes Figma as "The collaborative interface design tool";
    # it's visible page text, so no interface is structurally favored.
    predicate:
      all:
        - type: answer
          contains: [collaborative]
        - any:
            - type: browser_state
              url_path: "/figma"
            - type: worker_trace
              action: execute_native_tool
            - type: dom_element
              selector: "h1, [data-testid='bookmark-title'], .bookmark-title, a[href*='figma']"

