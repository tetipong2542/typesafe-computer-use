<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TypeSafe WebMCP E-Commerce Store</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 16px; }
        .badge { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 9999px; font-weight: bold; }
        .status-box { background: #f1f5f9; padding: 12px; border-radius: 8px; font-family: monospace; }
        button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #1d4ed8; }
        .product { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>TypeSafe WebMCP Official Store</h1>
            <div>Cart Items: <span id="cart-count" class="badge">0</span></div>
        </div>

        <div id="status-message" class="status-box">Status: Ready for WebMCP discovery</div>

        <div style="margin-top: 20px;">
            <h3>Products</h3>
            <div id="products-list">
                <div class="product" id="prod-p1">
                    <strong>MacBook M3 Max</strong> - $3,499 (ID: prod_macbook)
                </div>
                <div class="product" id="prod-p2">
                    <strong>Magic Keyboard</strong> - $199 (ID: prod_keyboard)
                </div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <h3>Cart</h3>
            <ul id="cart-items">
                <li id="cart-empty-msg">Cart is empty</li>
            </ul>
            <div id="order-status" style="font-weight: bold; color: #059669; margin-top: 10px;"></div>
        </div>

        <div style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
            <h3>Standard DOM Fallback Test Zone</h3>
            <button id="standard-dom-btn" onclick="document.getElementById('dom-click-result').innerText = 'Clicked Successfully';">
                Standard DOM Button
            </button>
            <div id="dom-click-result" style="margin-top: 8px; font-weight: bold;">Not Clicked</div>
        </div>
    </div>

    <!-- Declarative form tool test -->
    <form tool="subscribe_newsletter" description="Subscribe to email newsletter" style="display: none;">
        <input type="email" name="email" placeholder="Your email" required>
        <button type="submit">Subscribe</button>
    </form>

    <script>
        // State Store
        const store = {
            cart: {},
            lastQuery: '',
            order: null
        };

        // Initialize WebMCP Runtime Polyfill if needed
        if (!document.modelContext) {
            window.__webmcp_tools = new Map();
            const et = new EventTarget();
            document.modelContext = {
                registerTool(def) {
                    window.__webmcp_tools.set(def.name, def);
                    et.dispatchEvent(new CustomEvent('toolchange', { detail: { action: 'register', name: def.name } }));
                },
                unregisterTool(name) {
                    window.__webmcp_tools.delete(name);
                    et.dispatchEvent(new CustomEvent('toolchange', { detail: { action: 'unregister', name: name } }));
                },
                getTools() {
                    return Array.from(window.__webmcp_tools.values());
                },
                addEventListener: et.addEventListener.bind(et),
                removeEventListener: et.removeEventListener.bind(et),
                dispatchEvent: et.dispatchEvent.bind(et)
            };
        }

        // 1. Tool: search_products (Read-Only)
        document.modelContext.registerTool({
            name: "search_products",
            description: "Search the catalog of available products by keyword.",
            inputSchema: {
                type: "object",
                properties: {
                    query: { type: "string", description: "Search keyword" }
                },
                required: ["query"]
            },
            readOnlyHint: true,
            execute: async ({ query }) => {
                store.lastQuery = query;
                document.getElementById('status-message').innerText = `Status: Searched for '${query}'`;
                return { query, matches_found: 2, products: ["prod_macbook", "prod_keyboard"] };
            }
        });

        // 2. Tool: add_to_cart (Mutating)
        document.modelContext.registerTool({
            name: "add_to_cart",
            description: "Add a specified product and quantity to the user's shopping cart.",
            inputSchema: {
                type: "object",
                properties: {
                    product_id: { type: "string", description: "Product unique ID" },
                    quantity: { type: "number", description: "Number of units to add", minimum: 1 }
                },
                required: ["product_id", "quantity"]
            },
            consequentialHint: false,
            execute: async ({ product_id, quantity }) => {
                const qty = Number(quantity) || 1;
                store.cart[product_id] = (store.cart[product_id] || 0) + qty;

                // Update DOM
                const totalUnits = Object.values(store.cart).reduce((a, b) => a + b, 0);
                document.getElementById('cart-count').innerText = String(totalUnits);

                const cartUl = document.getElementById('cart-items');
                cartUl.innerHTML = '';
                for (const [id, count] of Object.entries(store.cart)) {
                    const li = document.createElement('li');
                    li.id = `cart-item-${id}`;
                    li.innerText = `${id}: ${count} unit(s)`;
                    cartUl.appendChild(li);
                }

                document.getElementById('status-message').innerText = `Status: Added ${qty} of ${product_id} to cart`;
                return { success: true, product_id, total_units: totalUnits, cart: store.cart };
            }
        });

        // 3. Tool: update_quantity (Mutating)
        document.modelContext.registerTool({
            name: "update_quantity",
            description: "Update quantity of a product currently in shopping cart.",
            inputSchema: {
                type: "object",
                properties: {
                    product_id: { type: "string", description: "Product unique ID" },
                    quantity: { type: "number", description: "New absolute quantity", minimum: 0 }
                },
                required: ["product_id", "quantity"]
            },
            consequentialHint: false,
            execute: async ({ product_id, quantity }) => {
                const qty = Number(quantity);
                if (qty <= 0) {
                    delete store.cart[product_id];
                } else {
                    store.cart[product_id] = qty;
                }

                const totalUnits = Object.values(store.cart).reduce((a, b) => a + b, 0);
                document.getElementById('cart-count').innerText = String(totalUnits);

                const cartUl = document.getElementById('cart-items');
                cartUl.innerHTML = '';
                for (const [id, count] of Object.entries(store.cart)) {
                    const li = document.createElement('li');
                    li.id = `cart-item-${id}`;
                    li.innerText = `${id}: ${count} unit(s)`;
                    cartUl.appendChild(li);
                }

                document.getElementById('status-message').innerText = `Status: Updated ${product_id} quantity to ${qty}`;
                return { success: true, product_id, quantity: qty, cart: store.cart };
            }
        });

        // 4. Tool: checkout (Consequential)
        document.modelContext.registerTool({
            name: "checkout",
            description: "Finalize cart purchase and charge payment method. Irreversible financial action.",
            inputSchema: {
                type: "object",
                properties: {
                    shipping_address: { type: "string", description: "Delivery postal address" },
                    payment_method: { type: "string", description: "Payment token or method, e.g. 'card_saved'" }
                },
                required: ["shipping_address", "payment_method"]
            },
            consequentialHint: true,
            execute: async ({ shipping_address, payment_method }) => {
                const totalUnits = Object.values(store.cart).reduce((a, b) => a + b, 0);
                if (totalUnits === 0) {
                    throw new Error("Cannot checkout an empty cart");
                }

                const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
                store.order = { orderId, address: shipping_address, units: totalUnits };
                store.cart = {};

                document.getElementById('cart-count').innerText = "0";
                document.getElementById('cart-items').innerHTML = '<li>Order placed!</li>';
                document.getElementById('order-status').innerText = `Order Confirmed: ${orderId} shipped to ${shipping_address}`;
                document.getElementById('status-message').innerText = `Status: Checkout complete (${orderId})`;

                return {
                    success: true,
                    order_id: orderId,
                    charged: true,
                    shipping_address
                };
            }
        });

        console.log("WebMCP E-Commerce tools registered successfully.");
    </script>
</body>
</html>
