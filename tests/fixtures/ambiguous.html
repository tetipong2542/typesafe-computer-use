<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TypeSafe Worker - Ambiguous Elements</title>
</head>
<body>
    <h1>Multiple Duplicate Buttons</h1>
    <div class="card" id="card-1">
        <p>Item 1</p>
        <button class="action-btn">Delete</button>
    </div>
    <div class="card" id="card-2">
        <p>Item 2</p>
        <button class="action-btn">Delete</button>
    </div>
    <div class="card" id="card-3">
        <p>Item 3</p>
        <button class="action-btn" style="display:none;">Delete</button>
    </div>
</body>
</html>
