<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TypeSafe Hybrid Closure Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9fb;
      color: #1a1a1a;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-width: 600px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #111827;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: #2563eb;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .status-box {
      margin-top: 25px;
      padding: 16px;
      border-radius: 6px;
      background-color: #f3f4f6;
      border: 1px solid #e5e7eb;
      font-family: monospace;
      font-size: 15px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background-color: #10b981;
      color: white;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">E2E TEST FIXTURE</div>
    <h1>TypeSafe Hybrid Router Verification</h1>
    <div class="form-group">
      <label for="search-input">Search Query</label>
      <input type="text" id="search-input" name="query" placeholder="Type search query..." data-testid="search-input" />
    </div>
    <div class="form-group">
      <button id="submit-btn" data-testid="submit-btn" onclick="handleSubmit()">Submit Query</button>
    </div>
    <div class="status-box">
      <div>Status: <span id="status">Initial Status</span></div>
      <div style="margin-top: 8px;">Action Log: <span id="action-log">Ready</span></div>
    </div>
  </div>

  <script>
    function handleSubmit() {
      const val = document.getElementById('search-input').value;
      document.getElementById('status').textContent = 'Submitted: ' + val;
      document.getElementById('action-log').textContent = 'DOM mutation applied successfully at ' + new Date().toISOString();
    }
  </script>
</body>
</html>
